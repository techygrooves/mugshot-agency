# ---------------------------------------------------------------------------
# Preview the site on GitHub Pages:
#   https://techygrooves.github.io/mugshot-agency/
#
# ⚠️  One manual step, once: Settings → Pages → Build and deployment →
#     Source: "GitHub Actions". Without it, GitHub runs its default Jekyll
#     build instead and the site will not appear.
#
# This is a PREVIEW, not production:
#   - it is served from a subpath, so scripts/make-preview.mjs prefixes every
#     link with /mugshot-agency
#   - every page is noindex, so the preview can never be indexed or compete
#     with the real domain at launch
#   - public/_headers (CSP etc.) is ignored by GitHub Pages
# ---------------------------------------------------------------------------
name: Preview on GitHub Pages

on:
  push:
    branches: [main]
  # Run by hand: Actions → Preview on GitHub Pages → Run workflow
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Full build with every check (types, tests, SEO, links, claims).
      - run: npm run build

      - name: Rebase links for the Pages subpath and mark pages noindex
        run: node scripts/make-preview.mjs --base="${{ steps.pages.outputs.base_path }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
